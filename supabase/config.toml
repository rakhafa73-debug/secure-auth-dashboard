# =============================================================================
# SecureAuth — local Supabase configuration
# =============================================================================
# Used by the Supabase CLI (`supabase start` / `supabase db reset`).
# For a hosted project, mirror these settings in the dashboard:
#   Authentication > URL Configuration
#   Authentication > Providers > Email (confirm email on/off)
#   Authentication > Rate limits
# =============================================================================

project_id = "secureauth"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/reset-password",
  "http://localhost:4173",
]
# Require users to confirm their email address.
enable_confirmations = true
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.rate_limit]
# Authentication rate limiting (requests per hour per IP). Tune for production.
email_sent = 2
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

[storage]
enabled = true
